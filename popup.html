<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=280">
  <link rel="stylesheet" href="popup.css">
  <title>FocusTube</title>
</head>
<body>
  <h1 class="title">
    <img class="brand-logo" src="icons/icon48.png" alt="" aria-hidden="true">
    <span>FocusTube</span>
  </h1>
  <p class="subtitle">YouTube Focus Mode</p>

  <button id="toggleBtn" type="button">Enable Focus Mode</button>

  <hr class="separator">

  <div class="dim-label">
    <span>Dim Level</span>
    <span id="dimValue">0%</span>
  </div>
  <input type="range" id="dimSlider" min="0" max="100" value="0" step="1">

  <p class="footer">Alt+Z to toggle anywhere</p>

  <script src="popup.js"></script>
</body>
</html>
